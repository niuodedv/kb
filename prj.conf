# ============================================================
# 蓝牙小键盘 —— 阶段 1：矩阵按键检测
# 详见 矩阵按键.txt
# ============================================================

# ---- 日志：板子未引出串口，用 SEGGER RTT 输出，无需飞线 ----
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# ---- 输入子系统（核心） ----
# 下面两项由设备树自动打开：
#   CONFIG_INPUT_GPIO_KBD_MATRIX  (default y, depends on DT_HAS_GPIO_KBD_MATRIX_ENABLED)
#   CONFIG_INPUT_KEYMAP           (default y, depends on DT_HAS_INPUT_KEYMAP_ENABLED)
# 注意：CONFIG_GPIO 必须显式打开，矩阵驱动不会自动 select 它，
#       否则会报 __device_dts_ord_<gpio0/gpio1> undeclared。
CONFIG_INPUT=y
CONFIG_GPIO=y

# ---- 按键 LED（WS2812 over SPI） ----
# 顶层 menuconfig 必须显式打开；WS2812_STRIP_SPI 在设备树节点使能后默认 y，
# 并会自动 select SPI。
CONFIG_LED_STRIP=y
CONFIG_SPI=y

# 灯带供电开关 RGB_PWR_EN(P0.13)，建模为 fixed regulator
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# ---- 模式检测（三模开关 SAADC） ----
# CONFIG_ADC_NRFX_SAADC 在设备树使能 &adc 后自动打开；
# 驱动 Kconfig.nrfx 已自动 select ADC_CONFIGURABLE_INPUTS，无需手动开。
CONFIG_ADC=y

# ---- 电源管理（IP5306 I2C） ----
# I2C(TWIM) 驱动在设备树使能 &i2c0 后自动打开
CONFIG_I2C=y

# ---- bring-up 验证工具（验证完可关） ----
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_SHELL_KBD_MATRIX_STATE=y
CONFIG_INPUT_EVENT_DUMP=y
