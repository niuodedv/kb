# ============================================================
# 蓝牙小键盘 —— 阶段 1：矩阵按键检测
# 详见 矩阵按键.txt
# ============================================================

# ---- 日志：板子未引出串口，用 SEGGER RTT 输出，无需飞线 ----
# 注意：不能再开 CONFIG_LOG_MODE_MINIMAL —— 它依赖 !LOG_MODE_MINIMAL，
#       会把 LOG_BACKEND_RTT 强制关掉（之前正是如此，导致 Kconfig 告警且 RTT 无输出）。
#       去掉 MINIMAL 后标准日志后端生效，RTT 才能真正看到日志。
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y

# ---- 输入子系统（核心） ----
# 下面两项由设备树自动打开：
#   CONFIG_INPUT_GPIO_KBD_MATRIX  (default y, depends on DT_HAS_GPIO_KBD_MATRIX_ENABLED)
#   CONFIG_INPUT_KEYMAP           (default y, depends on DT_HAS_INPUT_KEYMAP_ENABLED)
# 注意：CONFIG_GPIO 必须显式打开，矩阵驱动不会自动 select 它，
#       否则会报 __device_dts_ord_<gpio0/gpio1> undeclared。
CONFIG_INPUT=y
CONFIG_GPIO=y

# ---- 按键 LED（WS2812 over SPI） ----
# 顶层 menuconfig 必须显式打开；WS2812_STRIP_SPI 在设备树节点使能后默认 y，
# 并会自动 select SPI。
CONFIG_LED_STRIP=y
CONFIG_SPI=y

# 灯带供电开关 RGB_PWR_EN(P0.13)，建模为 fixed regulator
CONFIG_REGULATOR=y
CONFIG_REGULATOR_FIXED=y

# ---- 模式检测（三模开关 SAADC） ----
# CONFIG_ADC_NRFX_SAADC 在设备树使能 &adc 后自动打开；
# 驱动 Kconfig.nrfx 已自动 select ADC_CONFIGURABLE_INPUTS，无需手动开。
CONFIG_ADC=y

# ---- USB HID（三模开关 USB 档，详见 usb 通信.txt） ----
# 新栈（USB_DEVICE_STACK_NEXT）+ HID 类；UDC 驱动由 nrf-usbd 自动提供。
# 板上无 VBUS 检测引脚，软件直接 usbd_enable()。
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_HID_SUPPORT=y
# ⚠️ UDC 驱动事件线程栈默认仅 512B，处理枚举 + HID 类回调时栈溢出
#    （MPU FAULT / Stack overflow，线程 udc_nrfx），必须加大。
CONFIG_UDC_NRF_THREAD_STACK_SIZE=2048
# ⚠️ UDC 请求缓冲池默认 1024B，主机读描述符请求过 1026/4095 字节会分配
#    失败（Failed to allocate net_buf, ep 0x80 -> Malformed setup packet）。
CONFIG_UDC_BUF_POOL_SIZE=8192

# ---- 电源管理（IP5306 I2C） ----
# I2C(TWIM) 驱动在设备树使能 &i2c0 后自动打开
CONFIG_I2C=y

# ---- BLE HID（蓝牙通信，详见 BLE通信.txt） ----
# 角色：BLE Peripheral + HID over GATT（HOGP），电脑免驱识别为键盘+多媒体设备
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1
CONFIG_BT_SMP=y
CONFIG_BT_ATT_TX_COUNT=5
CONFIG_BT_DEVICE_NAME="kb-ble"
# 961 = HID Keyboard（GAP Appearance）
CONFIG_BT_DEVICE_APPEARANCE=961

# HID 服务；报告默认权限要求加密链路（主机配对后才能读写 HID 特征）
CONFIG_BT_HIDS=y
CONFIG_BT_HIDS_MAX_CLIENT_COUNT=1
CONFIG_BT_HIDS_DEFAULT_PERM_RW_ENCRYPT=y
CONFIG_BT_GATT_UUID16_POOL_SIZE=40
CONFIG_BT_GATT_CHRC_POOL_SIZE=20
CONFIG_BT_CONN_CTX=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="kb"

# 绑定信息持久化：配对成功后写入 Flash(板级 storage 分区)，重连无需再配对。
# settings 后端在 CONFIG_NVS 使能时默认是 SETTINGS_NVS，故需显式开 NVS。
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_MAP=y

# 蓝牙协议栈会让系统工作队列变忙，按 Nordic 官方样例加大栈
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_MAIN_STACK_SIZE=2048

# ---- bring-up 验证工具（验证完可关） ----
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_INPUT_SHELL=y
CONFIG_INPUT_SHELL_KBD_MATRIX_STATE=y
CONFIG_INPUT_EVENT_DUMP=y
